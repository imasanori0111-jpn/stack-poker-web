<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>STACK GTO ラボ(リバー) | スタックホールデム</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b1230; color: #e8ecf6; font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; line-height: 1.6; }
  main { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 20px; color: #f2d08a; margin: 0 0 4px; }
  h2 { font-size: 16px; color: #f2d08a; margin: 22px 0 8px; border-bottom: 1px solid rgba(224,176,74,.4); padding-bottom: 4px; }
  p { font-size: 14px; margin: 6px 0; }
  .meta { color: #a5aec8; font-size: 12px; }
  .note { background: rgba(255,200,80,.1); border: 1px solid rgba(255,200,80,.4); border-radius: 8px; padding: 8px 12px; font-size: 13px; }
  .proof { background: rgba(80,200,140,.12); border: 1px solid rgba(80,200,140,.5); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
  label { display: block; font-size: 13px; color: #c9d1e8; margin: 10px 0 4px; }
  input, select, button { font: inherit; font-size: 15px; border-radius: 8px; border: 1px solid rgba(224,176,74,.5); background: #141d45; color: #e8ecf6; padding: 8px 10px; box-sizing: border-box; }
  input, select { width: 100%; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  button { background: linear-gradient(#e7c574, #b98a2e); color: #20160a; font-weight: 700; border: none; padding: 10px 18px; margin-top: 14px; min-width: 220px; display: block; margin-left: auto; margin-right: auto; }
  button.sub { background: #141d45; color: #f2d08a; border: 1px solid rgba(224,176,74,.5); min-width: 0; display: inline-block; padding: 6px 10px; margin: 0; font-weight: 400; font-size: 14px; }
  button:disabled { opacity: .5; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .tabs button.on { background: #f2d08a; color: #20160a; }
  .bar { display: flex; height: 22px; border-radius: 6px; overflow: hidden; margin: 8px 0 4px; }
  .bar span { display: block; height: 100%; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .grid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 1px; margin-top: 10px; }
  .cell { position: relative; aspect-ratio: 1; background: #1a2350; font-size: 9px; overflow: hidden; border-radius: 2px; cursor: pointer; }
  .cell .fill { position: absolute; inset: 0; display: flex; flex-direction: column-reverse; }
  .cell .fill span { display: block; width: 100%; }
  .cell b { position: absolute; left: 1px; top: 0; font-weight: 600; color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000; }
  .cell.empty { opacity: .25; cursor: default; }
  .combos { font-size: 13px; margin-top: 8px; }
  .combos table { width: 100%; border-collapse: collapse; }
  .combos td { border-bottom: 1px solid rgba(255,255,255,.08); padding: 3px 4px; }
  .err { color: #ff9b9b; }
</style>
</head>
<body>
<main>
<h1>STACK GTO ラボ(リバー)</h1>
<p class="meta">2人のリバーを、この端末の中で解きます(外へは何も送りません)。研究用の試作です。</p>
<p class="meta">前もって解いたフロップ・ターンは <a href="library.html" style="color:#f2d08a">こちら</a>。</p>

<label for="board">ボード(5枚。例: 6s2d9hKc3d。s♠ h♥ d♦ c♣・T=10)</label>
<div class="row"><input id="board" value="6s2d9hKc3d" autocomplete="off" autocapitalize="off"><button class="sub" id="rand" type="button">ランダム</button></div>
<label for="range">レンジ(C1 のモデル: BTN のオープン 対 BB)</label>
<select id="range"><option value="c1-srp">1回レイズのポット(BB がコール)</option><option value="c1-3bp">3ベットのポット(BB が 3ベット・BTN がコール)</option></select>
<label for="depth">ポット 20 に対する残りのスタック</label>
<select id="depth"><option value="30">30(浅い・SPR 1.5)</option><option value="80" selected>80(深い・SPR 4)</option><option value="200">200(とても深い・SPR 10)</option></select>
<button id="go" type="button">解く</button>
<p id="status" class="meta"></p>

<div id="result" hidden>
  <div class="proof" id="proof"></div>
  <h2>打ち方</h2>
  <div class="tabs" id="tabs"></div>
  <p id="nodeinfo" class="meta"></p>
  <div class="bar" id="bar"></div>
  <div class="legend" id="legend"></div>
  <div class="grid" id="grid"></div>
  <div class="combos" id="combos"></div>
  <h2>この数字の意味</h2>
  <p class="note">「証明」は、この局面(このボード・ポット・スタック・両者のレンジ・ベットの選択肢)の中だけの数字です。相手が本当にこのレンジで来るとは限りません。ベットは画面の4択(席 × 浅い/深い)、レイズは 3倍・コール後のポットの 1/2・3/4・1 と ALL IN です。リバーより前の打ち方は入っていません。</p>
</div>
</main>
<script>
const RANKS = "23456789TJQKA", SUITS = "shdc", SUIT_JP = { s: "♠", h: "♥", d: "♦", c: "♣" };
// リバーの最初のベットの4択(apps/web/src/ringBetSizes.js の RIVER_BET_FRACS と同じ。浅い = 残り ≤ ポットの2倍)
const MENU = { shallow: { oop: "10,33,66,125", ip: "10,25,75,125" }, deep: { oop: "10,33,75,200", ip: "10,50,100,200" } };
const COLORS = { check: "#5f8fd8", call: "#46a86b", fold: "#6b7390", allin: "#c9302c" };
const betColor = (i) => ["#f2c15a", "#e99a3c", "#d9692f", "#b8422b"][Math.min(3, i)];
const raiseColor = (i) => ["#c77dd6", "#a65fc4", "#8547ad", "#642f8f"][Math.min(3, i)];
const $ = (id) => document.getElementById(id);
const worker = new Worker("worker.js");
let DATA = null, CUR = 0;

function actName(l) {
  if (l === "check") return "チェック"; if (l === "call") return "コール"; if (l === "fold") return "フォールド"; if (l === "allin") return "ALL IN";
  if (/^b\d+$/.test(l)) return "ベット " + l.slice(1) + "%";
  if (l === "r3x") return "レイズ 3倍";
  if (/^p\d+$/.test(l)) return "レイズ " + ({ 50: "1/2", 75: "3/4", 100: "1" }[l.slice(1)] || l.slice(1) + "%") + "(コール後のポット)";
  return l;
}
function actColors(labels) {
  let b = 0, r = 0;
  return labels.map((l) => COLORS[l] || (/^b/.test(l) ? betColor(b++) : raiseColor(r++)));
}
function nodeTitle(n) {
  if (n.after === "root") return "OOP(BB)の最初";
  if (n.after === "check") return "OOP がチェック → IP(BTN)";
  return "OOP が " + actName(n.after) + " → IP(BTN)";
}
function parseBoard(s) {
  s = s.replace(/\s+/g, "");
  if (!/^([2-9TJQKA][shdc]){5}$/i.test(s)) return null;
  const cs = s.match(/../g).map((c) => c[0].toUpperCase() + c[1].toLowerCase());
  return new Set(cs).size === 5 ? cs.join("") : null;
}
function classOf(h) { // "Kc9h" → [row, col, name]
  const r1 = RANKS.indexOf(h[0]), r2 = RANKS.indexOf(h[2]), hi = Math.max(r1, r2), lo = Math.min(r1, r2);
  const suited = h[1] === h[3];
  const row = 12 - (suited || hi === lo ? hi : lo), col = 12 - (suited || hi === lo ? lo : hi);
  return [row, col, RANKS[hi] + RANKS[lo] + (hi === lo ? "" : suited ? "s" : "o")];
}
$("rand").onclick = () => {
  const deck = []; for (const r of RANKS) for (const s of SUITS) deck.push(r + s);
  for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
  $("board").value = deck.slice(0, 5).join("");
};
// Hand-off from the library page (CLAUDE-263-238): a turn line's ranges, pot and stack, and the 5-card board
let HANDOFF = null;
try { if (location.hash === "#from-library") HANDOFF = JSON.parse(sessionStorage.getItem("lab-river-handoff") || "null"); } catch (e) { HANDOFF = null; }
if (HANDOFF) {
  $("board").value = HANDOFF.board; $("board").readOnly = true; $("rand").style.display = "none";
  $("range").closest("select").hidden = true; $("depth").hidden = true;
  document.querySelector('label[for="range"]').textContent = "レンジ: " + HANDOFF.label;
  document.querySelector('label[for="depth"]').textContent = `ポット ${HANDOFF.pot}・残り ${HANDOFF.stack}(ターンまでの進み方から)`;
}
// From the app's hand history (段階4・CLAUDE-263-241): #hand=<board>,<stack for pot 20>,<range>,<hero 2 cards>,<oop|ip>
let HERO = null;
{
  const m = /^#hand=([2-9TJQKA][shdc]{1}(?:[2-9TJQKA][shdc]){4}),([\d.]+),(c1-srp|c1-3bp),((?:[2-9TJQKA][shdc]){2}),(oop|ip)$/.exec(location.hash);
  if (m && !HANDOFF) {
    $("board").value = m[1]; $("board").readOnly = true; $("rand").style.display = "none";
    $("range").value = m[3]; $("range").disabled = true; $("depth").hidden = true;
    HERO = { stack: Math.max(0.5, Math.min(2000, Number(m[2]))), hand: m[4], seat: m[5] };
    document.querySelector('label[for="depth"]').textContent = `あなたのハンドから: ポット 20 にそろえて、残り ${HERO.stack}(${HERO.seat === "oop" ? "あなたが先に打つ側" : "あなたが後に打つ側"})`;
  }
}
if (HERO) setTimeout(() => $("go").click(), 0);
const sameHand = (a, b) => a && b && (a === b || a.slice(2) + a.slice(0, 2) === b);
$("go").onclick = () => {
  const board = parseBoard($("board").value);
  if (!board) { $("status").innerHTML = '<span class="err">ボードは、違うカード5枚で書いてください(例: 6s2d9hKc3d)</span>'; return; }
  const stack = HANDOFF ? HANDOFF.stack : HERO ? HERO.stack : Number($("depth").value), pot = HANDOFF ? HANDOFF.pot : 20, m = MENU[stack <= 2 * pot ? "shallow" : "deep"];
  $("go").disabled = true; $("status").textContent = "解いています…(数秒〜数十秒)";
  worker.postMessage({ board, pot, stack, range: $("range").value, ranges: HANDOFF ? HANDOFF.ranges : null, oopbets: m.oop, ipbets: m.ip, iters: 200 });
};
worker.onmessage = (ev) => {
  $("go").disabled = false;
  if (ev.data.error) { $("status").innerHTML = '<span class="err">解けませんでした: ' + ev.data.error.replace(/</g, "&lt;") + "</span>"; return; }
  DATA = ev.data.data; CUR = 0;
  $("status").textContent = `${DATA.hands.length} 通りの手札・${DATA.iters} 回・この端末で ${DATA.browserSeconds.toFixed(1)} 秒`;
  $("proof").innerHTML = `<b>証明</b>: この局面の中では、最善の相手でも、この打ち方から余分に取れるのは <b>ポットの ${DATA.exploitability_pct_pot.toFixed(2)}%</b> 以下です。`;
  $("result").hidden = false;
  renderTabs(); render();
};
function renderTabs() {
  const t = $("tabs"); t.innerHTML = "";
  DATA.nodes.forEach((n, i) => {
    if (i > 0 && n.line < 0.0005) return; // ほとんど起きない線は出さない
    const b = document.createElement("button"); b.className = "sub" + (i === CUR ? " on" : ""); b.type = "button";
    b.textContent = nodeTitle(n); b.onclick = () => { CUR = i; renderTabs(); render(); }; t.appendChild(b);
  });
}
function render() {
  const n = DATA.nodes[CUR], p = n.player === "OOP" ? 0 : 1, cols = actColors(n.labels);
  $("nodeinfo").textContent = `${n.player === "OOP" ? "OOP(BB)" : "IP(BTN)"}の番・この線に来る割合 ${(n.line * 100).toFixed(1)}%`;
  if (HERO && (n.player === "OOP") === (HERO.seat === "oop")) {
    const k = DATA.hands.findIndex((h) => sameHand(h, HERO.hand)), pretty = HERO.hand[0] + SUIT_JP[HERO.hand[1]] + HERO.hand[2] + SUIT_JP[HERO.hand[3]];
    $("nodeinfo").innerHTML += k >= 0 && DATA.weights[p][k] > 0
      ? `<br><b>あなたの手 ${pretty}</b>: ` + n.labels.map((l, a) => `${actName(l)} ${n.hand_pct[a][k]}%`).join("・")
      : `<br>あなたの手 ${pretty} は、この見本のレンジに入っていません`;
  }
  $("bar").innerHTML = n.freqs.map((f, a) => `<span style="width:${(f * 100).toFixed(2)}%;background:${cols[a]}"></span>`).join("");
  $("legend").innerHTML = n.labels.map((l, a) => `<span><i style="background:${cols[a]}"></i>${actName(l)} ${(n.freqs[a] * 100).toFixed(1)}%</span>`).join("");
  // 13×13: 手の種類ごとに、レンジの重みで平均した打ち方
  const agg = Array.from({ length: 169 }, () => ({ w: 0, f: n.labels.map(() => 0), combos: [] }));
  DATA.hands.forEach((h, i) => {
    const w = DATA.weights[p][i]; if (!(w > 0)) return;
    const [r, c, name] = classOf(h), g = agg[r * 13 + c]; g.name = name; g.w += w;
    n.hand_pct.forEach((arr, a) => { g.f[a] += w * arr[i]; });
    g.combos.push({ h, w, pct: n.hand_pct.map((arr) => arr[i]) });
  });
  const grid = $("grid"); grid.innerHTML = "";
  for (let r = 0; r < 13; r++) for (let c = 0; c < 13; c++) {
    const g = agg[r * 13 + c], hi = 12 - Math.min(r, c), lo = 12 - Math.max(r, c);
    const name = RANKS[hi] + RANKS[lo] + (r === c ? "" : r < c ? "s" : "o");
    const d = document.createElement("div"); d.className = "cell" + (g.w > 0 ? "" : " empty");
    d.innerHTML = (g.w > 0 ? `<div class="fill">${g.f.map((x, a) => `<span style="height:${(x / g.w).toFixed(1)}%;background:${cols[a]}"></span>`).join("")}</div>` : "") + `<b>${name}</b>`;
    if (g.w > 0) d.onclick = () => showCombos(name, g, n, cols);
    grid.appendChild(d);
  }
  $("combos").innerHTML = "";
}
function showCombos(name, g, n, cols) {
  const pretty = (h) => h[0] + SUIT_JP[h[1]] + h[2] + SUIT_JP[h[3]];
  $("combos").innerHTML = `<p><b>${name}</b>(手札ごと・%)</p><table>` + g.combos.map((c) =>
    `<tr><td>${pretty(c.h)}</td>${c.pct.map((x, a) => x > 0 ? `<td style="color:${cols[a]}">${actName(n.labels[a])} ${x}</td>` : "").join("")}</tr>`).join("") + "</table>";
}
</script>
</body>
</html>
